name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tkrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies (OpenMP for LightGBM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup test environment & DB
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/tkrp
          USE_DATABASE: true
        run: |
          cp .env.example .env
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:password@localhost:5432/tkrp|' .env
          sed -i 's|USE_DATABASE=.*|USE_DATABASE=true|' .env
          node apps/api/scripts/apply-migrations.js
          node apps/api/scripts/migrate-json-to-db.js

      - name: Run lint
        run: npm run lint

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/tkrp
          USE_DATABASE: true
        run: npm run test:spec

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Production (VPS)
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            if [ -f /var/www/tkrp/deploy/deploy.sh ]; then
              chmod +x /var/www/tkrp/deploy/deploy.sh
              /var/www/tkrp/deploy/deploy.sh
            else
              cd /var/www/tkrp
              git fetch origin main
              git reset --hard origin/main
              chmod +x deploy/deploy.sh
              ./deploy/deploy.sh
            fi
