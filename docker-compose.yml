# Local full stack (dev): needs .env in repo root (copy from .env.example).
# Host node_modules are hidden so Linux deps match the container (important on Windows/macOS).
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
      - '3001:3001'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    environment:
      PYTHON_BIN: /opt/tkrp-py/bin/python
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    # Compose 2.24+: optional file. Older Compose: `cp .env.example .env` before `up`.
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true

volumes:
  root_node_modules:
  api_node_modules:
